name: Sync to Hugging Face Hub
on:
  push:
    branches: [main]
  force_push: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0
          lfs: true
      - name: Push to Hub
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: git push https://israelrealivazquez2811:$HF_TOKEN@huggingface.co/spaces/israelrealivazquez2811/antigravity-omniswarm main
